name: Build and Deploy to SiteGround

# Deploys the built site to SiteGround on every push to main.
# Credentials come from repository Secrets (Settings → Secrets and variables →
# Actions) — nothing sensitive is stored in this file.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

permissions:
  contents: read

# Never let two deploys run at once (avoids half-uploaded sites).
concurrency:
  group: deploy-siteground
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site (outputs to dist/)
        run: npm run build

      - name: Deploy dist/ to SiteGround via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          # SiteGround SFTP is usually port 22; some accounts use 18765.
          # Add an SFTP_PORT secret only if 22 doesn't work for your account.
          port: ${{ secrets.SFTP_PORT || '22' }}
          local_path: "./dist/*"
          remote_path: ${{ secrets.SFTP_REMOTE_PATH }}
          sftp_only: true
          # Leave false for safety. Set to "true" to mirror exactly (deletes
          # remote files not present in dist/ — useful once old WordPress files
          # are cleared, but destructive, so enable deliberately).
          delete_remote_files: false
